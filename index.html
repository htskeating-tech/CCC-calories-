<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calorie Log</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    .item { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .kcal { font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
    label { display:block; margin-top: 8px; }
    input, select { margin-bottom: 8px; }
    #logList { margin-top: 1em; }
  </style>
</head>
<body>
  <h1>Calorie Log</h1>
  <label>
    Item name:
    <input type="text" id="itemName">
  </label>
  <label>
    Amount:
    <input type="number" id="amount" min="0" step="any">
    <select id="unit">
      <option value="g">g</option>
      <option value="ml">ml</option>
      <option value="">(none)</option>
    </select>
  </label>
  <label>
    kcal per 100g/ml:
    <input type="number" id="kcalPer100" min="0" step="any">
  </label>
  <label>
    kcal per packet/bottle:
    <input type="number" id="kcalPerPacket" min="0" step="any">
  </label>
  <br>
  <button id="btnCalc">Calculate</button>
  <button id="btnAdd">Add to Log</button>
  <span id="calcResult"></span>

  <h2>Today's Log (<span id="totalKcal">0</span>)</h2>
  <div id="logList"></div>
  <button id="btnExport">Export Weekly CSV</button>

  <script>
    const el = {
      itemName: document.getElementById("itemName"),
      amount: document.getElementById("amount"),
      unit: document.getElementById("unit"),
      kcalPer100: document.getElementById("kcalPer100"),
      kcalPerPacket: document.getElementById("kcalPerPacket"),
      btnCalc: document.getElementById("btnCalc"),
      btnAdd: document.getElementById("btnAdd"),
      calcResult: document.getElementById("calcResult"),
      logList: document.getElementById("logList"),
      totalKcal: document.getElementById("totalKcal"),
      btnExport: document.getElementById("btnExport")
    };

    // Store items grouped by date
    let logs = {};

    function todayKey() {
      const d = new Date();
      return d.toISOString().split("T")[0]; // YYYY-MM-DD
    }

    function calculateCalories() {
      const per100 = parseFloat(el.kcalPer100.value);
      const packet = parseFloat(el.kcalPerPacket.value);
      const amount = parseFloat(el.amount.value);
      const unit = el.unit.value;

      let total = NaN;
      let mode = "";

      if (!isNaN(packet)) {
        mode = "per packet/bottle";
        total = packet;
      } else if (!isNaN(per100)) {
        if (!isNaN(amount) && amount > 0) {
          mode = `per 100${unit} × ${amount}${unit}`;
          total = per100 * (amount / 100);
        } else {
          mode = `per 100${unit} (default)`;
          total = per100;
        }
      }

      if (isNaN(total)) {
        el.calcResult.innerHTML = '<span class="error">Enter per packet OR per 100g/ml.</span>';
        return null;
      }

      el.calcResult.innerHTML = `<span class="success">Calculated (${mode}): ${Math.round(total)} kcal</span>`;
      return Math.round(total);
    }

    el.btnCalc.addEventListener("click", calculateCalories);

    el.btnAdd.addEventListener("click", () => {
      const total = calculateCalories();
      if (total === null) return;

      const entry = {
        name: el.itemName.value || "Item",
        amount: el.amount.value || "",
        unit: el.unit.value,
        per100: el.kcalPer100.value || "",
        perPack: el.kcalPerPacket.value || "",
        totalKcal: total
      };

      const key = todayKey();
      if (!logs[key]) logs[key] = [];
      logs[key].push(entry);

      render();
      clearForm();
    });

    function render() {
      const key = todayKey();
      const items = logs[key] || [];
      el.logList.innerHTML = "";
      let total = 0;
      items.forEach((i) => {
        total += i.totalKcal;
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div>${i.name} (${i.amount}${i.unit || ""})</div><div class="kcal">${i.totalKcal} kcal</div>`;
        el.logList.appendChild(div);
      });
      el.totalKcal.textContent = `${total} kcal`;
    }

    function clearForm() {
      el.itemName.value = "";
      el.amount.value = "";
      el.kcalPer100.value = "";
      el.kcalPerPacket.value = "";
      el.calcResult.textContent = "";
    }

    // Export weekly CSV
    el.btnExport.addEventListener("click", () => {
      const rows = [["Date","Total kcal"]];
      let weeklyTotal = 0;

      Object.keys(logs).sort().forEach(date => {
        const dayTotal = logs[date].reduce((sum, i) => sum + i.totalKcal, 0);
        weeklyTotal += dayTotal;
        rows.push([date, dayTotal]);
      });

      rows.push(["Weekly Total", weeklyTotal]);

      // Convert to CSV string (properly quoting fields)
      const csvContent = rows.map(row =>
        row.map(field =>
          '"' + String(field).replace(/"/g, '""') + '"'
        ).join(",")
      ).join("\n");

      // Trigger download
      const blob = new Blob([csvContent], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "weekly-calorie-log.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
