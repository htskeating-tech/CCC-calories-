<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calorie Counter</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f1220; color:#e8ecf1; margin:0; }
    header { padding:20px; text-align:center; background:#131735; }
    h1 { margin:0; }
    .container { max-width:800px; margin:20px auto; padding:0 16px; }
    .card { background:#1a1f33; border:1px solid #2a3252; border-radius:10px; padding:16px; margin-bottom:20px; }
    .field { margin-bottom:12px; }
    .label { display:block; margin-bottom:6px; color:#a9b3c1; font-size:.9rem; }
    input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #34406b; background:#10142a; color:#e8ecf1; }
    button { background:#243059; color:#e8ecf1; border:1px solid #34406b; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; margin-top:6px; }
    button.primary { background:#234e31; border-color:#2c6b44; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { display:flex; justify-content:space-between; background:#141a2e; border:1px solid #2a3252; border-radius:8px; padding:10px; }
    .kcal { font-weight:700; color:#6ccf84; }
    .total { font-size:1.2rem; font-weight:700; color:#6ccf84; margin-top:10px; }
    .hint { font-size:.85rem; color:#a9b3c1; margin-top:4px; }
    .success { color:#6ccf84; }
    .error { color:#ff5f70; }
  </style>
</head>
<body>
  <header>
    <h1>Calorie Counter</h1>
    <p>Enter kcal per 100g/ml or per packet/bottle. If no amount entered, defaults to 100g/ml.</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Add Item</h2>
      <div class="field">
        <label class="label">Item name</label>
        <input id="itemName" type="text" placeholder="e.g., Cola 330ml" />
      </div>
      <div class="field">
        <label class="label">Amount</label>
        <div style="display:flex; gap:6px;">
          <input id="amount" type="number" min="0" placeholder="e.g., 330" style="flex:2;" />
          <select id="unit" style="flex:1;">
            <option value="g">g</option>
            <option value="ml">ml</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label">Calories per 100g/ml</label>
        <input id="kcalPer100" type="number" min="0" />
      </div>
      <div class="field">
        <label class="label">Calories per packet/bottle</label>
        <input id="kcalPerPacket" type="number" min="0" />
      </div>
      <button id="btnCalc">Calculate</button>
      <p id="calcResult" class="hint"></p>
      <button id="btnAdd" class="primary">Add to log</button>
    </div>

    <div class="card">
      <h2>Log</h2>
      <div class="list" id="logList"></div>
      <div class="total" id="totalKcal">0 kcal</div>
      <button id="btnExport">Export CSV</button>
    </div>
  </div>

  <script>
    const el = {
      itemName: document.getElementById("itemName"),
      amount: document.getElementById("amount"),
      unit: document.getElementById("unit"),
      kcalPer100: document.getElementById("kcalPer100"),
      kcalPerPacket: document.getElementById("kcalPerPacket"),
      btnCalc: document.getElementById("btnCalc"),
      btnAdd: document.getElementById("btnAdd"),
      calcResult: document.getElementById("calcResult"),
      logList: document.getElementById("logList"),
      totalKcal: document.getElementById("totalKcal"),
      btnExport: document.getElementById("btnExport")
    };

    let items = [];

    function loadLogs() {
      const saved = localStorage.getItem("calorieLog");
      if (saved) {
        items = JSON.parse(saved);
        render();
      }
    }

    function saveLogs() {
      localStorage.setItem("calorieLog", JSON.stringify(items));
    }

    function calculateCalories() {
      const per100 = parseFloat(el.kcalPer100.value);
      const packet = parseFloat(el.kcalPerPacket.value);
      const amount = parseFloat(el.amount.value);
      const unit = el.unit.value;

      let total = NaN;
      let mode = "";

      if (!isNaN(packet)) {
        mode = "per packet/bottle";
        total = packet;
      } else if (!isNaN(per100)) {
        if (!isNaN(amount) && amount > 0) {
          mode = `per 100${unit} × ${amount}${unit}`;
          total = per100 * (amount / 100);
        } else {
          mode = `per 100${unit} (default)`;
          total = per100;
        }
      }

      if (isNaN(total)) {
        el.calcResult.innerHTML = '<span class="error">Enter per packet OR per 100g/ml.</span>';
        return null;
      }

      el.calcResult.innerHTML = `<span class="success">Calculated (${mode}): ${Math.round(total)} kcal</span>`;
      return Math.round(total);
    }

    el.btnCalc.addEventListener("click", calculateCalories);

    el.btnAdd.addEventListener("click", () => {
      const total = calculateCalories();
      if (total === null) return;

      const item = {
        name: el.itemName.value || "Item",
        amount: el.amount.value || "",
        unit: el.unit.value,
        per100: el.kcalPer100.value || "",
        perPack: el.kcalPerPacket.value || "",
        totalKcal: total
      };
      items.push(item);
      saveLogs();
      render();
      clearForm();
    });

    function render() {
      el.logList.innerHTML = "";
      let total = 0;
      items.forEach((i) => {
        total += i.totalKcal;
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div>${i.name} (${i.amount}${i.unit})</div><div class="kcal">${i.totalKcal} kcal</div>`;
        el.logList.appendChild(div);
      });
      el.totalKcal.textContent = `${total} kcal`;
    }

    function clearForm() {
      el.itemName.value = "";
      el.amount.value = "";
      el.kcalPer100.value = "";
      el.kcalPerPacket.value = "";
      el.calcResult.textContent = "";
    }

    el.btnExport.addEventListener("click", () => {
      const rows = [["Item","Amount","Unit","kcal/100","kcal/packet","Total kcal"]];
      items.forEach(i => rows.push([i.name, i.amount, i.unit, i.per100, i.perPack, i.totalKcal]));
      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type:"text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "calorie-log.csv";
      a.click();
      URL.revokeObjectURL(url);
    });

    loadLogs();
  </script>
</body>
</html>
