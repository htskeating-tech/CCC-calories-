<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calorie Counter (Food & Drinks)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f1220; color:#e8ecf1; margin:0; }
    header { padding:20px; text-align:center; background:#131735; }
    h1 { margin:0; }
    .container { max-width:900px; margin:20px auto; padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:800px){ .container{ grid-template-columns:1fr; } }
    .card { background:#1a1f33; border:1px solid #2a3252; border-radius:10px; padding:16px; }
    .card h2 { margin-top:0; }
    .field { margin-bottom:12px; }
    .label { display:block; margin-bottom:6px; color:#a9b3c1; font-size:.9rem; }
    input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #34406b; background:#10142a; color:#e8ecf1; }
    button { background:#243059; color:#e8ecf1; border:1px solid #34406b; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; margin-top:6px; }
    button.primary { background:#234e31; border-color:#2c6b44; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { display:flex; justify-content:space-between; background:#141a2e; border:1px solid #2a3252; border-radius:8px; padding:10px; }
    .kcal { font-weight:700; color:#6ccf84; }
    .total { font-size:1.2rem; font-weight:700; color:#6ccf84; margin-top:10px; }
    .hint { font-size:.85rem; color:#a9b3c1; margin-top:4px; }
    .success { color:#6ccf84; }
    .error { color:#ff5f70; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Calorie Counter (Food & Drinks)</h1>
    <p>Enter kcal per 100g/ml or per packet/bottle. If no amount entered, defaults to 100g/100ml.</p>
  </header>

  <div class="container">
    <section class="card">
      <h2>Add Item</h2>
      <div class="field">
        <label class="label" for="itemName">Item name</label>
        <input id="itemName" type="text" placeholder="e.g., Cola 330ml" autocomplete="off" />
      </div>
      <div class="field">
        <label class="label" for="amount">Amount</label>
        <div style="display:flex; gap:6px;">
          <input id="amount" type="number" min="0" placeholder="e.g., 150 or 330" style="flex:2;" />
          <select id="unit" style="flex:1;">
            <option value="g">g</option>
            <option value="ml">ml</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label" for="kcalPer100">Calories per 100g/ml (kcal)</label>
        <input id="kcalPer100" type="number" min="0" />
      </div>
      <div class="field">
        <label class="label" for="kcalPerPacket">Calories per packet/bottle (kcal)</label>
        <input id="kcalPerPacket" type="number" min="0" />
      </div>
      <button id="btnCalc" type="button">Calculate</button>
      <p id="calcResult" class="hint"></p>
      <button id="btnAdd" class="primary" type="button">Add to log</button>
    </section>

    <section class="card">
      <h2>Day Log</h2>
      <div class="list" id="logList"></div>
      <div class="total" id="totalKcal">0 kcal</div>
      <button id="btnExport" type="button">Export CSV</button>
      <button id="btnImport" type="button">Import CSV</button>
      <input id="importFile" type="file" accept=".csv,text/csv" />
    </section>
  </div>

  <script>
    const el = {
      itemName: document.getElementById("itemName"),
      amount: document.getElementById("amount"),
      unit: document.getElementById("unit"),
      kcalPer100: document.getElementById("kcalPer100"),
      kcalPerPacket: document.getElementById("kcalPerPacket"),
      btnCalc: document.getElementById("btnCalc"),
      btnAdd: document.getElementById("btnAdd"),
      calcResult: document.getElementById("calcResult"),
      logList: document.getElementById("logList"),
      totalKcal: document.getElementById("totalKcal"),
      btnExport: document.getElementById("btnExport"),
      btnImport: document.getElementById("btnImport"),
      importFile: document.getElementById("importFile")
    };

    let items = [];

    // Load saved log on startup
    function loadLogs() {
      const saved = localStorage.getItem("calorieLog");
      if (saved) {
        try {
          items = JSON.parse(saved);
          if (!Array.isArray(items)) items = [];
        } catch(e) {
          items = [];
        }
        render();
      }
    }

    // Save log after changes
    function saveLogs() {
      localStorage.setItem("calorieLog", JSON.stringify(items));
    }

    function calculateCalories(showResult = true) {
      const per100 = parseFloat(el.kcalPer100.value);
      const packet = parseFloat(el.kcalPerPacket.value);
      const amount = parseFloat(el.amount.value);
      const unit = el.unit.value;

      let total = NaN;
      let mode = "";

      if (!isNaN(packet) && el.kcalPerPacket.value !== "") {
        mode = "per packet/bottle";
        total = packet;
      } else if (!isNaN(per100) && el.kcalPer100.value !== "") {
        if (!isNaN(amount) && amount > 0) {
          mode = `per 100${unit} × ${amount}${unit}`;
          total = per100 * (amount / 100);
        } else {
          mode = `per 100${unit} (default)`;
          total = per100;
        }
      }

      if (isNaN(total)) {
        if (showResult)
          el.calcResult.innerHTML = '<span class="error">Enter per packet OR per 100g/ml.</span>';
        return null;
      }

      if (showResult)
        el.calcResult.innerHTML = `<span class="success">Calculated (${mode}): ${Math.round(total)} kcal</span>`;
      return Math.round(total);
    }

    el.btnCalc.addEventListener("click", () => calculateCalories(true));

    el.btnAdd.addEventListener("click", () => {
      // Validation: must have at least one kcal field
      if (
        (el.kcalPerPacket.value === "" || isNaN(parseFloat(el.kcalPerPacket.value))) &&
        (el.kcalPer100.value === "" || isNaN(parseFloat(el.kcalPer100.value)))
      ) {
        el.calcResult.innerHTML = '<span class="error">Enter per packet OR per 100g/ml.</span>';
        return;
      }
      if (el.amount.value && parseFloat(el.amount.value) < 0) {
        el.calcResult.innerHTML = '<span class="error">Amount cannot be negative.</span>';
        return;
      }
      const total = calculateCalories(true);
      if (total === null) return;

      const item = {
        name: el.itemName.value.trim() || "Item",
        amount: el.amount.value || "",
        unit: el.unit.value,
        per100: el.kcalPer100.value || "",
        perPack: el.kcalPerPacket.value || "",
        totalKcal: total
      };
      items.push(item);
      saveLogs();
      render();
      clearForm();
    });

    function render() {
      el.logList.innerHTML = "";
      let total = 0;
      items.forEach((i) => {
        total += Number(i.totalKcal) || 0;
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div>${i.name} (${i.amount}${i.unit || ""})</div><div class="kcal">${i.totalKcal} kcal</div>`;
        el.logList.appendChild(div);
      });
      el.totalKcal.textContent = `${total} kcal`;
    }

    function clearForm() {
      el.itemName.value = "";
      el.amount.value = "";
      el.kcalPer100.value = "";
      el.kcalPerPacket.value = "";
      el.calcResult.textContent = "";
    }

    // Export CSV with mobile fallback
    el.btnExport.addEventListener("click", () => {
      const rows = [["Item","Amount","Unit","kcal/100","kcal/packet","Total kcal"]];
      items.forEach(i => rows.push([
        `"${(i.name||"").replace(/"/g, '""')}"`,
        `"${(i.amount||"").replace(/"/g, '""')}"`,
        `"${(i.unit||"").replace(/"/g, '""')}"`,
        `"${(i.per100||"").replace(/"/g, '""')}"`,
        `"${(i.perPack||"").replace(/"/g, '""')}"`,
        `"${(i.totalKcal||"").toString().replace(/"/g, '""')}"`
      ]));
      const csv = rows.map(r => r.join(",")).join("\n");
      try {
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "calorie_log.csv";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      } catch (e) {
        alert("Export failed: " + e.message);
      }
    });

    // Import CSV
    el.btnImport.addEventListener("click", () => {
      el.importFile.value = ""; // reset
      el.importFile.click();
    });

    el.importFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const text = ev.target.result;
        try {
          const lines = text.trim().split(/\r?\n/);
          if (lines.length < 2) throw new Error("No items found in file.");
          const header = lines[0].split(",");
          // Accepts both quoted and plain CSV
          items = [];
          for (let i = 1; i < lines.length; ++i) {
            let row = lines[i];
            // Simple CSV parse:
            const cols = [];
            let inQuotes = false, value = "";
            for (let c = 0; c < row.length; ++c) {
              let char = row[c];
              if (char === '"') {
                if (inQuotes && row[c+1] === '"') { value += '"'; c++; }
                else inQuotes = !inQuotes;
              } else if (char === "," && !inQuotes) {
                cols.push(value);
                value = "";
              } else {
                value += char;
              }
            }
            cols.push(value);
            if (cols.length < 6) continue;
            items.push({
              name: cols[0].replace(/^"|"$/g, ""),
              amount: cols[1].replace(/^"|"$/g, ""),
              unit: cols[2].replace(/^"|"$/g, ""),
              per100: cols[3].replace(/^"|"$/g, ""),
              perPack: cols[4].replace(/^"|"$/g, ""),
              totalKcal: Number(cols[5].replace(/^"|"$/g, "")) || 0
            });
          }
          saveLogs();
          render();
          alert("Import successful!");
        } catch (e) {
          alert("Import failed: " + e.message);
        }
      };
      reader.readAsText(file);
    });

    // Accessibility: allow Enter key to trigger Add to log
    el.itemName.addEventListener("keydown", function(e){ if(e.key==="Enter") el.btnAdd.click(); });
    el.amount.addEventListener("keydown", function(e){ if(e.key==="Enter") el.btnAdd.click(); });
    el.kcalPer100.addEventListener("keydown", function(e){ if(e.key==="Enter") el.btnAdd.click(); });
    el.kcalPerPacket.addEventListener("keydown", function(e){ if(e.key==="Enter") el.btnAdd.click(); });

    loadLogs();
  </script>
</body>
</html>
